# Publishes the site on every push to main (and on demand):
#  1. Supabase: database migrations, the process-upload Edge Function, Auth
#     settings, function secrets and the scanner account.
#  2. Cloudflare: Turnstile widget, Worker secrets, then the Worker itself.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   supabase.com/dashboard/account/tokens
#   CLOUDFLARE_API_TOKEN    "Edit Cloudflare Workers" template + Account → Turnstile → Edit
# Everything else is looked up or derived by scripts/ci-setup.mjs. Both
# services stay on their free plans; nothing here can turn on billing.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No job-wide secrets. Each step gets only the tokens it needs, and secret
    # values derived from them never go to $GITHUB_ENV (see scripts/ci-setup.mjs).
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Exactly the locked versions, and no package install scripts: esbuild,
      # workerd and the Supabase CLI ship prebuilt binaries as optional
      # dependencies, so nothing here needs a postinstall step.
      - name: Install dependencies (no secrets present)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Look up public settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci-setup.mjs supabase cloudflare

      - name: Database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF=$(node -p "require('./spies.deploy.json').supabaseProjectRef")
          npx supabase link --project-ref "$REF" < /dev/null
          npx supabase db push --linked --include-all < /dev/null

      - name: Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF=$(node -p "require('./spies.deploy.json').supabaseProjectRef")
          npx supabase functions deploy process-upload --project-ref "$REF" --use-api

      - name: Auth settings, function secrets and scanner account
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci-setup.mjs supabase cloudflare configure

      # Only public NEXT_PUBLIC_* values are present while the app is built.
      - name: Build
        run: npx opennextjs-cloudflare build

      - name: Deploy Worker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
        run: |
          trap 'rm -f "$WORKER_SECRETS_FILE"' EXIT
          node scripts/ci-setup.mjs supabase cloudflare worker-secrets
          DOMAIN=$(node -p "require('./spies.deploy.json').customDomain || ''")
          if [ -n "$DOMAIN" ]; then
            npx wrangler deploy --secrets-file "$WORKER_SECRETS_FILE" --domain "$DOMAIN"
          else
            npx wrangler deploy --secrets-file "$WORKER_SECRETS_FILE"
          fi

      - name: Check the live site
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" "$NEXT_PUBLIC_SITE_URL/")
          echo "Home page: HTTP $code"
          test "$code" = 200
          echo "### Live at $NEXT_PUBLIC_SITE_URL" >> "$GITHUB_STEP_SUMMARY"
