# Automatic ClamAV scanning on GitHub's free runners, every 5 minutes (GitHub
# may start scheduled runs a few minutes late) and on demand. Each run also
# removes stale upload reservations and stored objects no record needs. When
# no file is waiting it stops after that. Otherwise it downloads waiting files
# with the dedicated scanner account, scans them with up-to-date ClamAV
# signatures and records the result.
# With auto-publish on, clean listings go live right after this job.
#
# Needs the SUPABASE_ACCESS_TOKEN repository secret, which only the steps that
# run scripts/ci-setup.mjs (Node.js built-ins, no dependencies) receive. The
# scanner account is not a moderator: it can only read files waiting for a
# scan and record a first result. It signs in with a one-time login token that
# is created after every install step and handed only to the scan step.
# The repository is public, so its logs show only ids and counts.
name: Virus scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virus-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check for files waiting for a scan and clean up storage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ci-setup.mjs pending cleanup

      # The locked dependency versions, without install scripts, before any
      # login exists. The website is not built here.
      - name: Install scanner dependencies (no secrets present)
        if: env.SPIES_PENDING != '0'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install ClamAV
        if: env.SPIES_PENDING != '0'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clamav
          sudo systemctl stop clamav-freshclam || true

      - name: Restore signature cache
        if: env.SPIES_PENDING != '0'
        uses: actions/cache@v5
        with:
          path: /tmp/clamav-db
          key: clamav-db-${{ github.run_id }}
          restore-keys: clamav-db-

      - name: Update signatures
        if: env.SPIES_PENDING != '0'
        run: |
          mkdir -p /tmp/clamav-db
          sudo cp -n /tmp/clamav-db/* /var/lib/clamav/ 2>/dev/null || true
          sudo freshclam --stdout
          sudo cp /var/lib/clamav/*.c?d /tmp/clamav-db/ && sudo chown -R "$USER" /tmp/clamav-db

      # Only Node.js built-ins run here. The token is a masked step output for
      # the next step only, never written to $GITHUB_ENV.
      - name: Create a one-time scanner login
        id: login
        if: env.SPIES_PENDING != '0'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ci-setup.mjs supabase scanner-login

      - name: Scan pending files
        if: env.SPIES_PENDING != '0'
        env:
          SPIES_ADMIN_TOKEN_HASH: ${{ steps.login.outputs.token_hash }}
        run: node scripts/admin-scan.mjs --limit 100
