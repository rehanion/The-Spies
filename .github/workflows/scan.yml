# Automatic ClamAV scanning. Runs on GitHub's free runners every hour (and on
# demand), downloads files waiting for a scan with a dedicated moderator
# account, scans them with up-to-date ClamAV signatures and records the result.
# With auto-publish on, clean listings go live right after this job.
#
# Needs the SUPABASE_ACCESS_TOKEN repository secret. The scanner signs in as
# the moderator account that the Deploy workflow creates; it never uses a key
# that bypasses Row Level Security.
name: Virus scan

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virus-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only the script's one dependency is installed; the website is not built here.
      - name: Look up the scanner login
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/ci-setup.mjs supabase
          # The scanner only needs its own login; drop the server key from this job.
          echo "SUPABASE_SECRET_KEY=" >> "$GITHUB_ENV"
          echo "PROCESSOR_SECRET=" >> "$GITHUB_ENV"
          echo "ACTOR_HASH_SALT=" >> "$GITHUB_ENV"

      - name: Install scanner dependencies
        run: |
          mkdir -p /tmp/scanner && cp scripts/admin-scan.mjs /tmp/scanner/
          cd /tmp/scanner && npm init -y >/dev/null && npm install --no-audit --no-fund @supabase/supabase-js@2.118.0

      - name: Install ClamAV
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clamav
          sudo systemctl stop clamav-freshclam || true

      - name: Restore signature cache
        uses: actions/cache@v4
        with:
          path: /tmp/clamav-db
          key: clamav-db-${{ github.run_id }}
          restore-keys: clamav-db-

      - name: Update signatures
        run: |
          mkdir -p /tmp/clamav-db
          sudo cp -n /tmp/clamav-db/* /var/lib/clamav/ 2>/dev/null || true
          sudo freshclam --stdout
          sudo cp /var/lib/clamav/*.c?d /tmp/clamav-db/ && sudo chown -R "$USER" /tmp/clamav-db

      - name: Scan pending files
        working-directory: /tmp/scanner
        run: node admin-scan.mjs --limit 100
